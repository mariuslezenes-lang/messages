<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Messages</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f7f8fa; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0f766e; --accent-soft:#ccfbf1; --me:#0f766e; --me-text:#ffffff; --them:#ffffff; --them-text:#111827;
  --danger:#dc2626; --chat-bg:#e9edf0; --shadow:0 1px 2px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0f14; --panel:#111821; --panel-2:#16202b; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2a36;
    --accent:#2dd4bf; --accent-soft:#134e4a; --me:#0f766e; --me-text:#f0fdfa; --them:#1b2532; --them-text:#e5e7eb;
    --chat-bg:#0d141b; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.solid{fill:currentColor;stroke:none}
#app{height:100dvh;display:flex;flex-direction:column}

/* ---------- commun ---------- */
.field{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);color:var(--text);font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
.primary{width:100%;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.primary:disabled{opacity:.45;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn.danger{color:var(--danger)}
.round-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.round-btn[hidden],.icon-btn[hidden]{display:none}
.av{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:calc(var(--s)*.38);flex:none;user-select:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.demo-banner{background:var(--accent-soft);color:var(--text);font-size:13px;padding:7px 16px;text-align:center}

/* ---------- auth ---------- */
.auth{flex:1;display:grid;place-items:center;padding:16px}
.auth-card{width:100%;max-width:360px;background:var(--panel);border-radius:20px;padding:28px 22px;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center}
.auth-card h1{margin:10px 0 18px;font-size:24px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto}
.logo svg{width:34px;height:34px}
.tabs{display:flex;background:var(--panel-2);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border-radius:9px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
#authForm{display:flex;flex-direction:column;gap:10px}
.auth-msg{min-height:20px;margin:4px 0 0;font-size:13px;color:var(--muted)}

/* ---------- shell ---------- */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr;max-width:1300px;width:100%;margin:0 auto;background:var(--panel)}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 12px 8px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.side-head h1{flex:1;margin:0;font-size:22px}
.search{padding:4px 16px 10px}
.conv-list{list-style:none;margin:0;padding:0 8px 12px;overflow-y:auto;flex:1}
.conv-list li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer}
.conv-list li:hover{background:var(--panel-2)}
.conv-list li.active{background:var(--accent-soft)}
.conv-list li.none{color:var(--muted);cursor:default;justify-content:center;text-align:center;padding:30px 16px}
.conv-list li.none:hover{background:none}
.ci{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--muted)}
.prev{flex:1;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .prev{color:var(--text);font-weight:500}
.unread .time{color:var(--accent);font-weight:600}
.badge{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;min-height:0;background:var(--chat-bg)}
.empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.head-txt{min-width:0;flex:1}
.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none;margin-left:-6px}
.messages{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:12px 14px 6px;overscroll-behavior:contain}
.loading,.empty-chat{margin:auto;color:var(--muted);font-size:14px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--panel);padding:3px 12px;border-radius:10px;margin:14px 0 8px;box-shadow:var(--shadow)}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(78%,520px);margin-top:3px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.first{margin-top:10px}
.sender{font-size:12px;font-weight:600;color:var(--accent);margin:0 12px 2px}
.bubble{position:relative;padding:7px 12px 7px;border-radius:18px;background:var(--them);color:var(--them-text);box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.me .bubble{background:var(--me);color:var(--me-text)}
.t{float:right;font-size:10.5px;opacity:.65;margin:7px 0 -3px 10px;white-space:nowrap}
.bubble.img{padding:3px}
.bubble.img img{display:block;width:260px;max-width:100%;height:auto;min-height:120px;max-height:340px;object-fit:cover;border-radius:15px;background:var(--line);cursor:zoom-in}
.bubble.img .t{position:absolute;right:10px;bottom:8px;margin:0;color:#fff;opacity:1;background:rgba(0,0,0,.4);padding:1px 6px;border-radius:8px}
.audio{display:flex;align-items:center;gap:10px;width:220px;max-width:60vw;padding:2px 0}
.play{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.18);flex:none}
.play svg{width:18px;height:18px}
.bar{flex:1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.prog{height:100%;width:0;background:currentColor}
.dur{font-size:12px;opacity:.8;min-width:32px;font-variant-numeric:tabular-nums}
.pending{opacity:.6}
.failed .bubble{outline:2px solid var(--danger)}

/* ---------- composer ---------- */
.composer-wrap{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.composer,.recbar{display:flex;align-items:flex-end;gap:6px}
.composer[hidden],.recbar[hidden]{display:none}
#txt{flex:1;resize:none;max-height:140px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:16px;line-height:1.35;outline:none}
#txt:focus{border-color:var(--accent)}
.recbar{align-items:center;padding:0 2px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
#recTime{font-variant-numeric:tabular-nums;font-weight:600}
.rec-hint{flex:1;color:var(--muted);font-size:14px}
@keyframes pulse{50%{opacity:.25}}

/* ---------- modale & visionneuse ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal-card{width:100%;max-width:420px;max-height:85dvh;display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:20px;padding:16px}
.modal-card header{display:flex;align-items:center}
.modal-card h2{flex:1;margin:0;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);padding:5px 10px;border-radius:14px;font-size:13px}
.ures{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:60px}
.ures li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer}
.ures li:hover{background:var(--panel-2)}
.ures li.on{background:var(--accent-soft)}
.ures li .ci{flex:1}
.ures li .check{color:var(--accent);font-weight:700;visibility:hidden}
.ures li.on .check{visibility:visible}
.ures li.none{color:var(--muted);cursor:default;justify-content:center}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:30;cursor:zoom-out}
.viewer[hidden]{display:none}
.viewer img{max-width:96vw;max-height:92dvh;border-radius:8px}

@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .chat{display:none}
  .shell.in-chat .sidebar{display:none}
  .shell.in-chat .chat{display:flex}
  .back{display:grid}
  .msg{max-width:84%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script type="module">
/* =====================================================================
   CONFIG — colle ici l'URL et la clé "anon / publishable" de ton projet
   Supabase (Project Settings → API). Laisse vide = mode démo local.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://gdyjevrffdlzhkjuknua.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_reTormXrQM9y3vv7n_wasg_qL7Qh-fg',
};

/* ---------------- utilitaires ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const timeFmt = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' });
const fmtDur = ms => { const s = Math.max(0, Math.round((ms || 0) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const previewOf = m => m.kind === 'image' ? '📷 Photo' : m.kind === 'audio' ? '🎤 Message vocal' : (m.body || '');
const extFor = t => /webm/.test(t) ? 'webm' : /mp4|aac|m4a/.test(t) ? 'm4a' : /ogg/.test(t) ? 'ogg' : /jpe?g/.test(t) ? 'jpg' : /png/.test(t) ? 'png' : /gif/.test(t) ? 'gif' : /webp/.test(t) ? 'webp' : 'bin';

function dayLabel(d) {
  const t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Aujourd'hui";
  if (d.toDateString() === y.toDateString()) return 'Hier';
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function listTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), t = new Date();
  if (d.toDateString() === t.toDateString()) return timeFmt.format(d);
  if ((t - d) / 864e5 < 6) return d.toLocaleDateString('fr-FR', { weekday: 'short' });
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}
function avatar(name, size = 40) {
  const n = (name || '?').trim() || '?';
  let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360;
  const ini = n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return `<div class="av" style="--s:${size}px;background:hsl(${h} 50% 42%)">${esc(ini)}</div>`;
}
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3500);
}

const icons = {
  bubble: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 17l5-5-5-5M21 12H9"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  image: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  mic: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg>',
  play: '<svg viewBox="0 0 24 24" class="solid"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" class="solid"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* =====================================================================
   BACKEND SUPABASE
   ===================================================================== */
async function supabaseBackend() {
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const urlCache = new Map();
  let me = null;

  async function loadMe() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return (me = null);
    const { data, error } = await sb.from('profiles').select('id,username,display_name,avatar_url').eq('id', session.user.id).single();
    if (error) throw error;
    return (me = data);
  }
  function normConv(c) {
    const members = (c.conversation_members || []).map(m => ({ ...m.profiles, last_read_at: m.last_read_at }));
    const mine = members.find(m => m.id === me.id);
    const other = members.find(m => m.id !== me.id);
    return {
      id: c.id, isGroup: c.is_group, members, other,
      name: c.title || other?.display_name || other?.username || 'Moi',
      lastAt: c.last_message_at, preview: c.last_preview, lastSender: c.last_sender,
      unread: !!(c.last_sender && c.last_sender !== me.id && mine && new Date(c.last_message_at) > new Date(mine.last_read_at)),
    };
  }

  return {
    demo: false,
    me: () => me,
    loadMe,
    async signIn(email, password) {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error; return loadMe();
    },
    async signUp(email, password, username) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, display_name: username }, emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw error;
      return data.session ? loadMe() : null;
    },
    async signOut() { await sb.auth.signOut(); me = null; },
    async listConversations() {
      const { data, error } = await sb.from('conversations')
        .select('id,title,is_group,last_message_at,last_preview,last_sender,conversation_members(user_id,last_read_at,profiles(id,username,display_name,avatar_url))')
        .order('last_message_at', { ascending: false });
      if (error) throw error;
      return data.map(normConv);
    },
    async searchUsers(q) {
      const s = q.replace(/[,%()*\\]/g, '').trim();
      if (!s) return [];
      const { data, error } = await sb.from('profiles').select('id,username,display_name')
        .or(`username.ilike.%${s}%,display_name.ilike.%${s}%`).neq('id', me.id).limit(15);
      if (error) throw error; return data;
    },
    async startDirect(other) {
      const { data, error } = await sb.rpc('start_direct', { other }); if (error) throw error; return data;
    },
    async createGroup(title, ids) {
      const { data, error } = await sb.rpc('create_group', { p_title: title, p_members: ids }); if (error) throw error; return data;
    },
    async listMessages(convId) {
      const { data, error } = await sb.from('messages').select('*').eq('conversation_id', convId)
        .order('created_at', { ascending: false }).limit(200);
      if (error) throw error; return data.reverse();
    },
    async send(m, blob) {
      let media_path = null;
      if (blob) {
        media_path = `${m.conversation_id}/${m.id}.${extFor(blob.type)}`;
        const { error } = await sb.storage.from('media').upload(media_path, blob, { contentType: blob.type || 'application/octet-stream' });
        if (error) throw error;
      }
      const row = { id: m.id, conversation_id: m.conversation_id, sender_id: me.id, kind: m.kind, body: m.body, media_path, duration_ms: m.duration_ms };
      const { data, error } = await sb.from('messages').insert(row).select().single();
      if (error) throw error; return data;
    },
    async mediaUrl(path) {
      const hit = urlCache.get(path);
      if (hit && hit.exp > Date.now()) return hit.url;
      const { data, error } = await sb.storage.from('media').createSignedUrl(path, 3600);
      if (error) throw error;
      urlCache.set(path, { url: data.signedUrl, exp: Date.now() + 3500e3 });
      return data.signedUrl;
    },
    async markRead(convId) {
      await sb.from('conversation_members').update({ last_read_at: new Date().toISOString() })
        .eq('conversation_id', convId).eq('user_id', me.id);
    },
    subscribe({ onMessage, onMembership }) {
      sb.channel('feed-' + me.id)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => onMessage(p.new))
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'conversation_members', filter: `user_id=eq.${me.id}` }, () => onMembership())
        .subscribe();
    },
  };
}

/* =====================================================================
   BACKEND DÉMO (en mémoire, aucune donnée ne sort du navigateur)
   ===================================================================== */
function demoBackend() {
  const me = { id: 'me', username: 'moi', display_name: 'Moi' };
  const people = [
    { id: 'u1', username: 'lea', display_name: 'Léa Martin' },
    { id: 'u2', username: 'karim', display_name: 'Karim B.' },
    { id: 'u3', username: 'sophie', display_name: 'Sophie' },
    { id: 'u4', username: 'julien', display_name: 'Julien' },
  ];
  const all = [me, ...people], byId = id => all.find(p => p.id === id);
  const ago = min => new Date(Date.now() - min * 60000).toISOString();
  const convs = [
    { id: 'c1', title: null, is_group: false, memberIds: ['me', 'u1'], created_at: ago(5000), readAt: ago(20) },
    { id: 'c2', title: 'Apéro vendredi', is_group: true, memberIds: ['me', 'u2', 'u3', 'u4'], created_at: ago(5000), readAt: ago(200) },
    { id: 'c3', title: null, is_group: false, memberIds: ['me', 'u3'], created_at: ago(9000), readAt: ago(1) },
  ];
  const msgs = [];
  const add = (c, s, body, min) => msgs.push({ id: uuid(), conversation_id: c, sender_id: s, kind: 'text', body, media_path: null, duration_ms: null, created_at: ago(min) });
  add('c3', 'me', 'Merci pour hier soir !', 4000); add('c3', 'u3', 'Avec plaisir 😊 On remet ça quand tu veux', 3990);
  add('c2', 'u2', 'Qui ramène quoi vendredi ?', 300); add('c2', 'u3', 'Je m’occupe du dessert 🍰', 280);
  add('c2', 'me', 'Moi les boissons', 275); add('c2', 'u4', 'Je prends le pain et le fromage', 8);
  add('c1', 'u1', 'Salut ! Tu es dispo ce soir ?', 1500); add('c1', 'me', 'Oui, après 19h 👍', 1490); add('c1', 'u1', 'Parfait, je t’appelle vers 19h30', 12);
  const replies = ['Ah oui carrément !', 'Haha 😄', 'Je regarde ça et je te dis', 'Top, merci !', 'Ça marche 👌', 'Trop bien !', 'Ok pour moi'];
  let listener = { onMessage() {}, onMembership() {} };

  function normalize(c) {
    const ms = msgs.filter(m => m.conversation_id === c.id), last = ms[ms.length - 1];
    const members = c.memberIds.map(byId), other = members.find(p => p.id !== 'me');
    return {
      id: c.id, isGroup: c.is_group, members, other, name: c.title || other.display_name,
      lastAt: last?.created_at || c.created_at, preview: last ? previewOf(last) : null, lastSender: last?.sender_id,
      unread: !!last && last.sender_id !== 'me' && last.created_at > (c.readAt || ''),
    };
  }
  function scheduleReply(row) {
    const c = convs.find(x => x.id === row.conversation_id);
    const others = c.memberIds.filter(x => x !== 'me');
    const who = others[Math.floor(Math.random() * others.length)];
    const body = row.kind === 'image' ? 'Belle photo 😍' : row.kind === 'audio' ? 'Bien reçu ton vocal 🎧' : replies[Math.floor(Math.random() * replies.length)];
    setTimeout(() => {
      const r = { id: uuid(), conversation_id: c.id, sender_id: who, kind: 'text', body, media_path: null, duration_ms: null, created_at: new Date().toISOString() };
      msgs.push(r); listener.onMessage({ ...r });
    }, 1200 + Math.random() * 1600);
  }

  return {
    demo: true,
    me: () => me,
    loadMe: async () => me,
    signOut: async () => {},
    listConversations: async () => convs.map(normalize).sort((a, b) => b.lastAt.localeCompare(a.lastAt)),
    searchUsers: async q => people.filter(p => (p.username + ' ' + p.display_name).toLowerCase().includes(q.toLowerCase())),
    startDirect: async uid => {
      let c = convs.find(x => !x.is_group && x.memberIds.includes(uid));
      if (!c) { c = { id: uuid(), title: null, is_group: false, memberIds: ['me', uid], created_at: new Date().toISOString() }; convs.push(c); }
      return c.id;
    },
    createGroup: async (title, ids) => {
      const c = { id: uuid(), title, is_group: true, memberIds: ['me', ...ids], created_at: new Date().toISOString() };
      convs.push(c); return c.id;
    },
    listMessages: async id => { await sleep(150); return msgs.filter(m => m.conversation_id === id).map(m => ({ ...m })); },
    send: async (m, blob) => {
      await sleep(blob ? 500 : 200);
      const row = { id: m.id, conversation_id: m.conversation_id, sender_id: 'me', kind: m.kind, body: m.body, duration_ms: m.duration_ms,
        media_path: blob ? URL.createObjectURL(blob) : null, created_at: new Date().toISOString() };
      msgs.push(row); scheduleReply(row); return { ...row };
    },
    mediaUrl: async p => p,
    markRead: async id => { const c = convs.find(x => x.id === id); if (c) c.readAt = new Date().toISOString(); },
    subscribe: l => { listener = l; },
  };
}

const state = { be: null, convs: [], active: null, msgs: {}, stick: true, rec: null };
const getConv = id => state.convs.find(c => c.id === id);
const findMsg = id => { for (const k in state.msgs) { const m = state.msgs[k].find(x => x.id === id); if (m) return m; } };
const memberName = (conv, uid) => { const p = conv?.members.find(m => m.id === uid); return p?.display_name || p?.username || 'Quelqu’un'; };

function friendlyError(e) {
  const msg = e?.message || String(e);
  if (/Invalid login/i.test(msg)) return 'E-mail ou mot de passe incorrect.';
  if (/already registered/i.test(msg)) return 'Un compte existe déjà avec cet e-mail.';
  if (/Email not confirmed/i.test(msg)) return 'Confirme ton e-mail avant de te connecter.';
  if (/Password should/i.test(msg)) return 'Mot de passe trop court (6 caractères minimum).';
  return msg;
}

function openConv(id) {

async function loadMessages(id) {
  try {
    const list = await state.be.listMessages(id);
    const pending = (state.msgs[id] || []).filter(m => m.pending || m.failed);
    state.msgs[id] = [...list, ...pending.filter(p => !list.some(m => m.id === p.id))];
  } catch (e) { toast(friendlyError(e)); state.msgs[id] = state.msgs[id] || []; }
  if (state.active === id) renderMessages();
}

function sepHTML(m, prev) {
  const d = new Date(m.created_at);
  if (prev && new Date(prev.created_at).toDateString() === d.toDateString()) return '';
  return `<div class="day">${esc(dayLabel(d))}</div>`;
}
function bubbleHTML(m, prev) {
  const me = state.be.me(), mine = m.sender_id === me.id, conv = getConv(m.conversation_id);
  const newRun = !prev || prev.sender_id !== m.sender_id || !!sepHTML(m, prev) || (new Date(m.created_at) - new Date(prev.created_at) > 5 * 60000);
  const sender = conv?.isGroup && !mine && newRun ? `<div class="sender">${esc(memberName(conv, m.sender_id))}</div>` : '';
  const t = `<span class="t">${m.failed ? '⚠︎' : m.pending ? '…' : timeFmt.format(new Date(m.created_at))}</span>`;
  const src = m.local ? `data-src="${esc(m.local)}"` : `data-path="${esc(m.media_path)}"`;
  let inner;
  if (m.kind === 'image') inner = `<div class="bubble img"><img alt="Photo" ${m.local ? `src="${esc(m.local)}"` : `data-path="${esc(m.media_path)}"`}>${t}</div>`;
  else if (m.kind === 'audio') inner = `<div class="bubble"><div class="audio" ${src}><button type="button" class="play" aria-label="Lire">${icons.play}</button><div class="bar"><div class="prog"></div></div><span class="dur">${fmtDur(m.duration_ms)}</span></div>${t}</div>`;
  else inner = `<div class="bubble">${esc(m.body)}${t}</div>`;
  return `<div class="msg ${mine ? 'me' : ''} ${newRun ? 'first' : ''} ${m.pending ? 'pending' : ''} ${m.failed ? 'failed' : ''}" data-id="${esc(m.id)}">${sender}${inner}</div>`;
}
function hydrate(root) {
  root.querySelectorAll('img[data-path]:not([src])').forEach(async img => {
    try { img.src = await state.be.mediaUrl(img.dataset.path); } catch { img.alt = 'Image indisponible'; }
  });
  root.querySelectorAll('img:not([data-h])').forEach(img => {
    img.dataset.h = 1;
    img.addEventListener('load', () => { if (state.stick) scrollBottom(); });
  });
}
function scrollBottom() { const b = $('#msgs'); if (b) b.scrollTop = b.scrollHeight; }

function renderMessages() {
  const list = state.msgs[state.active] || [], box = $('#msgs'); if (!box) return;
  box.innerHTML = list.length ? list.map((m, i) => sepHTML(m, list[i - 1]) + bubbleHTML(m, list[i - 1])).join('')
    : '<div class="empty-chat">Aucun message. Dis bonjour 👋</div>';
  hydrate(box); state.stick = true; scrollBottom();
}
function rerenderBubble(m) {
  const el = document.querySelector(`.msg[data-id="${CSS.escape(m.id)}"]`); if (!el) return;
  const arr = state.msgs[m.conversation_id] || [], i = arr.findIndex(x => x.id === m.id);
  el.outerHTML = bubbleHTML(m, arr[i - 1]);
  hydrate($('#msgs'));
}

/* Ajoute ou met à jour un message (envoi local, confirmation serveur ou temps réel) */
function pushMsg(m) {
  const me = state.be.me(), conv = getConv(m.conversation_id);
  if (!conv) { refreshConvs(); return; }
  const arr = state.msgs[m.conversation_id];
  if (arr) {
    const i = arr.findIndex(x => x.id === m.id);
    if (i >= 0) {
      arr[i] = { ...arr[i], ...m, local: arr[i].local, pending: !!m.pending, failed: false };
      if (state.active === m.conversation_id) rerenderBubble(arr[i]);
      return;
    }
    arr.push(m);
  }
  conv.lastAt = m.created_at; conv.preview = previewOf(m); conv.lastSender = m.sender_id;
  const isActive = state.active === m.conversation_id, visible = document.visibilityState === 'visible';
  if (m.sender_id !== me.id && !(isActive && visible)) conv.unread = true;
  state.convs.sort((a, b) => (b.lastAt || '').localeCompare(a.lastAt || ''));
  renderConvList();

  if (isActive && arr) {
    const box = $('#msgs'); box.querySelector('.empty-chat,.loading')?.remove();
    const prev = arr[arr.length - 2];
    box.insertAdjacentHTML('beforeend', sepHTML(m, prev) + bubbleHTML(m, prev));
    hydrate(box);
    if (state.stick || m.sender_id === me.id) { state.stick = true; scrollBottom(); }
    if (m.sender_id !== me.id && visible) markReadSoon();
  }
}

async function send(kind, p) {
  const convId = state.active, me = state.be.me();
  if (!state.msgs[convId]) state.msgs[convId] = [];
  const m = { id: uuid(), conversation_id: convId, sender_id: me.id, kind, body: p.body ?? null, media_path: null,
    duration_ms: p.duration ?? null, created_at: new Date().toISOString(), pending: true, local: p.local };
  pushMsg(m);
  try { pushMsg(await state.be.send(m, p.blob)); }
  catch (e) {
    console.error(e);
    const x = findMsg(m.id); if (x) { x.pending = false; x.failed = true; if (state.active === convId) rerenderBubble(x); }
    toast("Échec de l'envoi : " + friendlyError(e));
  }
}

/* ---------- photos ---------- */
async function compressImage(file, max = 1600) {
  if (!file.type.startsWith('image/')) throw new Error('Ce fichier n’est pas une image');
  if (file.type === 'image/gif') return file;
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) return file;
  const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.85));
}

/* ---------- messages vocaux ---------- */
async function startRec() {
  if (state.rec) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Enregistrement audio non pris en charge ici');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { return toast('Accès au micro refusé'); }
  const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported?.(t));
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const r = { rec, stream, chunks: [], t0: Date.now(), cancel: false };
  state.rec = r;
  rec.ondataavailable = e => e.data.size && r.chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(r.timer); state.rec = null;
    if ($('#recbar')) { $('#recbar').hidden = true; $('#composer').hidden = false; }
    const duration = Date.now() - r.t0;
    if (r.cancel || duration < 600) return;
    const blob = new Blob(r.chunks, { type: (rec.mimeType || mime || 'audio/webm').split(';')[0] });
    send('audio', { blob, duration, local: URL.createObjectURL(blob) });
  };
  rec.start(250);
  $('#composer').hidden = true; $('#recbar').hidden = false; $('#recTime').textContent = '0:00';
  r.timer = setInterval(() => {
    const d = Date.now() - r.t0;
    if ($('#recTime')) $('#recTime').textContent = fmtDur(d);
    if (d > 5 * 60000) stopRec(false);
  }, 250);
}
function stopRec(cancel) {
  const r = state.rec; if (!r) return;
  r.cancel = cancel;
  if (r.rec.state !== 'inactive') r.rec.stop();
}

const player = new Audio();
let playingEl = null;
function audioMsg(el) { return findMsg(el.closest('.msg')?.dataset.id); }
player.ontimeupdate = () => {
  if (!playingEl) return;
  const m = audioMsg(playingEl);
  const total = isFinite(player.duration) && player.duration > 0 ? player.duration * 1000 : (m?.duration_ms || 1);
  playingEl.querySelector('.prog').style.width = Math.min(100, player.currentTime * 1000 / total * 100) + '%';
  playingEl.querySelector('.dur').textContent = fmtDur(player.currentTime * 1000);
};
player.onended = resetPlaying;
function resetPlaying() {
  if (!playingEl) return;
  const el = playingEl; playingEl = null;
  if (!el.isConnected) return;
  el.querySelector('.play').innerHTML = icons.play;
  el.querySelector('.prog').style.width = '0';
  el.querySelector('.dur').textContent = fmtDur(audioMsg(el)?.duration_ms);
}
async function toggleAudio(el) {
  if (playingEl === el) {
    if (player.paused) { player.play(); el.querySelector('.play').innerHTML = icons.pause; }
    else { player.pause(); el.querySelector('.play').innerHTML = icons.play; }
    return;
  }
  player.pause(); resetPlaying();
  playingEl = el; el.querySelector('.play').innerHTML = icons.pause;
  try {
    player.src = el.dataset.src || await state.be.mediaUrl(el.dataset.path);
    await player.play();
  } catch { toast('Lecture impossible'); resetPlaying(); }
}

  let results = [], t;

  $('#uq').oninput = e => {

    const q = e.target.value.trim();
    t = setTimeout(async () => {
      if (!q) { $('#ures').innerHTML = '<li class="none">Tape un nom pour chercher</li>'; return; }
      results = await state.be.searchUsers(q).catch(err => { toast(friendlyError(err)); return []; });
      $('#ures').innerHTML = results.length ? results.map(u => `
        <li data-id="${esc(u.id)}">${avatar(u.display_name || u.username, 36)}
          <div class="ci"><div class="title">${esc(u.display_name || u.username)}</div><div class="sub">@${esc(u.username)}</div></div>
          <span class="check">✓</span></li>`).join('') : '<li class="none">Aucun résultat</li>';
      update();
    }, 250);
  };
  $('#ures').onclick = e => {
    const li = e.target.closest('li[data-id]'); if (!li) return;
    const u = results.find(x => x.id === li.dataset.id); if (!u) return;
    sel.has(u.id) ? sel.delete(u.id) : sel.set(u.id, u); update();
  };
  $('#chips').onclick = e => { const b = e.target.closest('.chip'); if (b) { sel.delete(b.dataset.id); update(); } };
  $('#mStart').onclick = async () => {
    $('#mStart').disabled = true;
    try {
      const ids = [...sel.keys()];
      const id = ids.length === 1 ? await state.be.startDirect(ids[0]) : await state.be.createGroup($('#gname').value.trim() || 'Groupe', ids);
      closeModal(); await refreshConvs(); openConv(id);
    } catch (err) { toast(friendlyError(err)); $('#mStart').disabled = false; }
  };
  setTimeout(() => $('#uq').focus(), 50);
}

/* ---------- démarrage ---------- */
async function boot() {
  try {
    state.be = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY ? await supabaseBackend() : demoBackend();
    (await state.be.loadMe()) ? startApp() : renderAuth();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="auth"><div class="auth-card"><h1>Oups</h1><p>${esc(friendlyError(e))}</p></div></div>`;
  }
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
